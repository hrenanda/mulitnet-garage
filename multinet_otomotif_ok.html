<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multinet Garage — Showroom & Marketplace Kendaraan Indonesia</title>
<meta name="description" content="Beli dan jual mobil & motor baru/bekas di Indonesia. Cari, bandingkan, simulasi kredit, dan hubungi showroom terverifikasi.">
<meta name="theme-color" content="#0B2A5B">
<script>/* Terapkan tema sebelum render agar tidak berkedip */try{if(localStorage.getItem('mg_theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --blue:#0B2A5B; --blue-2:#12386F; --blue-ink:#071A3A;
  --orange:#FF7A00; --orange-d:#E56A00; --orange-t:#FFF1E3;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F8; --surface-3:#E4EAF3;
  --text:#101828; --muted:#5B6B84; --line:#DDE4EE;
  --green:#0E9F6E; --green-t:#E6F6F0; --red:#D92D20; --red-t:#FDECEA; --amber:#B54708; --amber-t:#FEF3E6;
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sh:0 1px 2px rgba(16,24,40,.05),0 10px 28px -14px rgba(11,42,91,.22);
  --sh-lg:0 24px 60px -24px rgba(7,26,58,.35);
  --fd:'Poppins',sans-serif; --fb:'Inter',sans-serif;
}
[data-theme="dark"]{
  --blue:#16335F; --blue-2:#1D4076; --blue-ink:#0C1F42;
  --orange-t:#3A2510;
  --bg:#0A1120; --surface:#121B2F; --surface-2:#1A2440; --surface-3:#223055;
  --text:#E9EEF7; --muted:#96A5BF; --line:#26345A;
  --green-t:#0E2B21; --red-t:#331412; --amber-t:#33200C;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
select,input,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,42,91,.14)}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.22;letter-spacing:-.01em}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.hide{display:none!important}
::selection{background:var(--orange);color:#fff}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
/* ============ TOMBOL & CHIP ============ */
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;font-weight:600;font-size:14px;padding:10px 18px;border-radius:11px;transition:transform .12s, box-shadow .15s, background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn-o{background:var(--orange);color:#fff;box-shadow:0 6px 16px -6px rgba(255,122,0,.55)}
.btn-o:hover{background:var(--orange-d)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:var(--blue-2)}
.btn-out{border:1.5px solid var(--line);background:var(--surface)}.btn-out:hover{border-color:var(--blue);color:var(--blue)}
[data-theme="dark"] .btn-out:hover{color:#fff}
.btn-wa{background:#1FA855;color:#fff}.btn-wa:hover{background:#178A45}
.btn-ghost{color:var(--muted)}.btn-ghost:hover{color:var(--blue)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn-lg{padding:14px 26px;font-size:15.5px;border-radius:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);transition:.15s;cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip svg{width:15px;height:15px}
.chip .x{margin-left:2px;opacity:.7}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em;text-transform:uppercase}
.bdg svg{width:11px;height:11px}
.bdg-new{background:var(--green-t);color:var(--green)}
.bdg-old{background:var(--surface-2);color:var(--muted)}
.bdg-ver{background:rgba(255,255,255,.92);color:var(--blue)}
[data-theme="dark"] .bdg-ver{background:var(--blue);color:#fff}
.bdg-promo{background:var(--orange);color:#fff}
.bdg-ev{background:#E5F7EC;color:#0B7A50}[data-theme="dark"] .bdg-ev{background:#0E2B21;color:#3FCF8E}
.bdg-star{background:var(--blue);color:#fff}
.bdg-pend{background:var(--amber-t);color:var(--amber)}
/* ============ TOPBAR ============ */
.topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
.tb-in{max-width:1200px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:800;font-size:18.5px;color:var(--blue);cursor:pointer;flex-shrink:0}
[data-theme="dark"] .logo{color:#fff}
.logo b{color:var(--orange);font-weight:800}
.logo svg{width:34px;height:34px}
.tb-nav{display:flex;gap:2px;flex:1}
.tb-nav a{padding:8px 11px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tb-nav a:hover{color:var(--blue);background:var(--surface-2)}
.tb-nav a.on{color:var(--blue);background:var(--surface-2)}
[data-theme="dark"] .tb-nav a.on{color:#fff}
.tb-nav a.hot{color:var(--orange)}
.tb-act{display:flex;align-items:center;gap:8px;margin-left:auto}
.icbtn{position:relative;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icbtn:hover{background:var(--surface-2);color:var(--blue)}
.icbtn svg{width:20px;height:20px}
.icbtn .n{position:absolute;top:4px;right:3px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--fd);cursor:pointer}
.drop{position:absolute;top:56px;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);min-width:220px;padding:8px;z-index:70}
.drop a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer}
.drop a:hover{background:var(--surface-2)}
.drop a svg{width:16px;height:16px;color:var(--muted)}
.drop .sep{height:1px;background:var(--line);margin:6px 4px}
/* ============ BOTTOM NAV (MOBILE) ============ */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);display:none;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);flex:1;padding:4px 0}
.bnav button svg{width:21px;height:21px}
.bnav button.on{color:var(--blue)}
.bnav .sell{flex:0 0 56px}
.bnav .sell .cir{width:52px;height:52px;border-radius:16px;background:var(--orange);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 8px 20px -6px rgba(255,122,0,.6)}
.bnav .sell .cir svg{width:24px;height:24px}
/* ============ DRAWER ============ */
.ovl{position:fixed;inset:0;background:rgba(7,26,58,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:85vw;background:var(--surface);z-index:85;transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.drawer.on{transform:none}
.drawer.right{left:auto;right:0;transform:translateX(105%);width:340px}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px}
.drawer-b a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-weight:600;font-size:14.5px}
.drawer-b a:hover{background:var(--surface-2)}
.drawer-b a svg{width:18px;height:18px;color:var(--muted)}
/* ============ HERO ============ */
.hero{background:var(--blue-ink);color:#fff;position:relative;overflow:hidden}
.hero .road{position:absolute;inset:0;opacity:.35;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:64px 0 56px}
.hero h1{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p.sub{color:#B9C7DE;margin:14px 0 26px;font-size:15.5px;max-width:520px}
.hero-stats{display:flex;gap:26px;margin-top:26px;color:#B9C7DE;font-size:13px;flex-wrap:wrap}
.hero-stats b{display:block;font-family:var(--fd);font-size:20px;color:#fff}
.sbar{background:var(--surface);border-radius:var(--r-lg);padding:10px;display:grid;grid-template-columns:1fr 1.1fr 1.1fr 1.1fr auto;gap:0;box-shadow:var(--sh-lg)}
.sbar .fld{padding:2px 12px;border-right:1px solid var(--line)}
.sbar .fld:last-of-type{border-right:none}
.sbar label{margin-bottom:2px;font-size:11px}
.sbar select{border:none;padding:4px 0;font-weight:600;background:transparent;color:var(--text)}
.sbar select:focus{box-shadow:none}
.sbar .btn{border-radius:12px}
.hfeat{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-lg);color:var(--text);cursor:pointer;position:relative}
.hfeat img{aspect-ratio:16/10;object-fit:cover;width:100%}
.hfeat .hb{padding:16px 18px}
.hfeat .hp{font-family:var(--fd);font-weight:800;font-size:21px;color:var(--blue)}
[data-theme="dark"] .hfeat .hp{color:var(--orange)}
.hfeat .tag{position:absolute;top:14px;left:14px;background:rgba(255,122,0,.95);color:#fff;font-size:11px;font-weight:700;padding:5px 11px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.hfeat .tag svg{width:12px;height:12px}
.hfeat-dots{display:flex;gap:6px;margin-top:12px;justify-content:center}
.hfeat-dots span{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.3);transition:.2s}
.hfeat-dots span.on{background:var(--orange);width:20px}
/* ============ SEKSI UMUM ============ */
.sec{padding:44px 0 8px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sec-h h2{font-size:clamp(19px,2.4vw,25px);font-weight:700}
.sec-h .more{font-size:13.5px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}
[data-theme="dark"] .sec-h .more{color:var(--orange)}
.sec-h .more svg{width:15px;height:15px}
.sec-h .sub{color:var(--muted);font-size:13.5px;margin-top:3px;font-weight:400}
.catrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.cat{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:11px 17px;font-weight:600;font-size:13.5px;transition:.15s;cursor:pointer}
.cat:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-2px)}
.cat svg{width:18px;height:18px;color:var(--orange)}
.brow{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-behavior:smooth}
.bitem{flex:0 0 96px;text-align:center;cursor:pointer}
.bitem .mono{width:66px;height:66px;margin:0 auto 8px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:20px;color:var(--blue);transition:.15s}
[data-theme="dark"] .bitem .mono{color:#fff}
.bitem:hover .mono{border-color:var(--orange);color:var(--orange);transform:translateY(-3px)}
.bitem span{font-size:12px;font-weight:600;color:var(--muted)}
/* ============ KARTU IKLAN ============ */
.grid-c{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;transition:transform .18s, box-shadow .18s;display:flex;flex-direction:column}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.vc-media{position:relative;aspect-ratio:4/3;background:var(--surface-2);cursor:pointer;display:block}
.vc-media img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vcard:hover .vc-media img{transform:scale(1.045)}
.vc-bdgs{position:absolute;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.fav{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--muted);transition:.15s;z-index:2}
[data-theme="dark"] .fav{background:rgba(18,27,47,.9)}
.fav svg{width:17px;height:17px}
.fav.on{color:var(--orange)}
.fav.on svg{fill:var(--orange)}
.fav:hover{transform:scale(1.1)}
.vc-body{padding:12px 14px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.vc-price{font-family:var(--fd);font-weight:800;font-size:17px;color:var(--blue);display:flex;align-items:baseline;gap:8px}
[data-theme="dark"] .vc-price{color:var(--orange)}
.vc-old{font-size:12px;font-weight:600;color:var(--muted);text-decoration:line-through;font-family:var(--fb)}
.vc-title{font-weight:600;font-size:13.5px;line-height:1.35;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc-title:hover{color:var(--orange)}
.vc-meta{display:flex;flex-wrap:wrap;gap:4px 0;font-size:12px;color:var(--muted)}
.vc-meta span:not(:last-child)::after{content:"·";margin:0 6px}
.vc-loc{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.vc-loc svg{width:13px;height:13px}
.vc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line)}
.selltag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.selltag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selltag svg{width:13px;height:13px;flex-shrink:0}
.selltag.dealer svg{color:var(--blue)}
.cmpb{width:29px;height:29px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);flex-shrink:0;transition:.15s}
.cmpb svg{width:14px;height:14px}
.cmpb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cmpb:hover{border-color:var(--blue);color:var(--blue)}
.cmpb.on:hover{color:#fff}
.lrow{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;margin-bottom:14px;transition:box-shadow .18s}
.lrow:hover{box-shadow:var(--sh)}
.lrow .vc-media{flex:0 0 250px;aspect-ratio:4/3}
.lrow .vc-body{padding:15px 17px}
.lrow .vc-title{font-size:15.5px}
@media(max-width:640px){.lrow{flex-direction:column}.lrow .vc-media{flex:none;width:100%}}
/* ============ LISTING ============ */
.lst-layout{display:grid;grid-template-columns:270px 1fr;gap:26px;align-items:start;padding:26px 0 50px}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
.fgroup{padding:13px 0;border-bottom:1px solid var(--line)}
.fgroup:last-child{border:none}
.fgroup h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:9px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips .chip{padding:5px 11px;font-size:12px}
.lst-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.lst-toolbar .count{font-size:13.5px;color:var(--muted);margin-right:auto}
.active-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.active-chips .chip{background:var(--blue);border-color:var(--blue);color:#fff;padding:5px 11px;font-size:12px}
.viewtog{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.viewtog button{width:36px;height:34px;display:grid;place-items:center;color:var(--muted)}
.viewtog button.on{background:var(--surface-2);color:var(--blue)}
.viewtog svg{width:16px;height:16px}
.loadmore-wrap{display:flex;justify-content:center;margin-top:26px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;margin:0 auto 14px;color:var(--line)}
/* ============ DETAIL ============ */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:16px 0 4px}
.crumb a{cursor:pointer}.crumb a:hover{color:var(--blue)}
.crumb svg{width:12px;height:12px}
.d-layout{display:grid;grid-template-columns:1.55fr 1fr;gap:30px;padding:10px 0 40px;align-items:start}
.gal-main{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);cursor:zoom-in;position:relative}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-count{position:absolute;bottom:12px;right:12px;background:rgba(7,26,58,.75);color:#fff;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;display:flex;gap:6px;align-items:center}
.gal-count svg{width:14px;height:14px}
.gal-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:9px}
.gal-thumbs img{aspect-ratio:4/3;object-fit:cover;border-radius:9px;cursor:pointer;border:2.5px solid transparent;transition:.15s}
.gal-thumbs img.on,.gal-thumbs img:hover{border-color:var(--orange)}
.d-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:sticky;top:80px}
.d-price{font-family:var(--fd);font-weight:800;font-size:29px;color:var(--blue)}
[data-theme="dark"] .d-price{color:var(--orange)}
.d-install{font-size:13px;color:var(--muted);margin:2px 0 16px}
.d-install b{color:var(--text)}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.spec-grid>div{background:var(--surface);padding:13px 15px}
.spec-grid .k{font-size:11.5px;color:var(--muted);font-weight:600}
.spec-grid .v{font-weight:700;font-size:14px;margin-top:2px}
.seller-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:22px}
.seller-top{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.seller-mono{width:52px;height:52px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:19px;flex-shrink:0}
.acts-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.calc-mini{background:var(--surface-2);border-radius:var(--r);padding:16px;margin-top:22px}
.calc-mini .out{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.calc-mini .out b{font-family:var(--fd);font-size:21px;color:var(--blue)}
[data-theme="dark"] .calc-mini .out b{color:var(--orange)}

const ARTICLES=[
 {id:'a1',cat:'Tips',title:'Panduan Cek Mobil Bekas Sebelum Membeli: 12 Titik Wajib Diperiksa',date:'12 Des 2024',read:7,seed:'art-cek',
  body:['Membeli mobil bekas bukan sekadar soal harga dan tampilan luar. Kesalahan paling umum pembeli pemula adalah terpaku pada kilometer rendah tanpa memeriksa kondisi teknis sesungguhnya. Mulailah dari dokumen: pastikan nomor rangka dan mesin sesuai STNK, dan BPKB tidak dalam status gadaian.','Lanjut ke fisik unit. Periksa celah panel (panel gap) apakah rata — celah yang tidak konsisten bisa mengindikasikan riwayat tabrakan. Buka kap mesin: cek kebocoran oli di sekitar valve cover, warna oli transmisi, dan kondisi baterai. Saat mesin menyala, dengarkan suara idle yang stabil tanpa getaran berlebih.','Uji jalan wajib dilakukan minimal 20 menit di jalan tol dan jalan berlubang. Rasakan perpindahan gigi, bunyi pada kaki-kaki, dan tarikan saat RPM tinggi. Terakhir, jangan ragu meminta bantuan mekanik independen — biaya ratusan ribu rupiah bisa menyelamatkan Anda dari kerugian puluhan juta.']},
 {id:'a2',cat:'Berita',title:'Makin Dekat dengan EV: Apakah Waktunya Pindah ke Mobil Listrik?',date:'8 Des 2024',read:6,seed:'art-ev',
  body:['Penjualan mobil listrik di Indonesia terus menunjukkan pertumbuhan dua digit sepanjang tahun ini, ditopang pabrikan baru, pilihan model yang makin beragam, dan insentif pembebasan pajak progresif.','Pertanyaannya: apakah sekarang waktu yang tepat? Jika pola pemakaian Anda mayoritas dalam kota dengan akses charging di rumah, jawabannya hampir selalu ya. Biaya operasional listrik bisa serendah sepertiga biaya bensin, dan perawatan jauh lebih sedikit karena tidak ada oli mesin maupun timing belt.','Namun bagi yang sering menempuh perjalanan jauh ke luar Jawa, infrastruktur SPKLU masih perlu jadi pertimbangan matang. Rencanakan rute, cek jaringan SPKLU, dan pertimbangkan hybrid sebagai jalan tengah.']},
 {id:'a3',cat:'Kredit',title:'Cara Menghitung Cicilan Mobil: Anuitas vs Bunga Flat',date:'5 Des 2024',read:5,seed:'art-kredit',
  body:['Sebelum tanda tangan kontrak leasing, pahami dua metode bunga yang umum dipakai di Indonesia: bunga flat dan bunga anuitas (efektif). Bunga flat dihitung dari pokok pinjaman awal, sehingga cicilan tetap sepanjang tenor — mudah dipahami tetapi total bunganya lebih besar.','Bunga anuitas menghitung bunga dari saldo pokok yang tersisa, sehingga porsi bunga mengecil seiring waktu. Cicilannya sedikit lebih besar di awal namun totalnya lebih efisien untuk tenor panjang.','Tips praktis: gunakan simulasi kredit untuk membandingkan total pembayaran, bukan hanya besaran cicilan bulanan. Dan ingat, idealnya angsuran tidak lebih dari 30% penghasilan bulanan Anda.']},
 {id:'a4',cat:'Tips',title:'Rawat Motor Matic agar Tidak Gampang Mogok',date:'1 Des 2024',read:4,seed:'art-matic',
  body:['Motor matic andal karena praktis, tapi komponen CVT-nya butuh perhatian rutin. V-belt dan roller sebaiknya dicek setiap 8.000–12.000 km; gejala aus adalah getaran saat akselerasi dan tarikan yang berat di bawah 30 km/jam.','Kebiasaan yang merusak CVT tanpa disadari: menyalakan mesin sambil menahan rem belakang terlalu lama, membawa beban berlebih, dan menahan gas di posisi setengah dalam waktu lama.','Jangan lupa oli mesin setiap 2.000 km, busi tiap 8.000 km, dan baterai sekali per tahun. Dengan perawatan Rp 300–500 ribu per periode, matic Anda bisa tembus 100 ribu km tanpa overhaul.']},
 {id:'a5',cat:'Tips',title:'Showroom vs Perorangan: Mana yang Lebih Aman untuk Mobil Bekas?',date:'26 Nov 2024',read:6,seed:'art-showroom',
  body:['Membeli dari showroom terverifikasi umumnya memberi jaminan proses: unit sudah melalui inspeksi, dokumen diurus pihak showroom, dan ada garansi mesin tertentu. Konsekuensinya, harga biasanya 5–10% lebih tinggi dari jual-lepas perorangan.','Sementara membeli dari perorangan bisa lebih murah dan negosiasi lebih fleksibel — tetapi Anda menanggung risiko pemeriksaan unit dan legalitas sendirian.','Aturan aman: dari showroom, pilih yang terverifikasi dan punya ulasan nyata; dari perorangan, selalu ajak mekanik, lakukan jual beli di biro jasa yang tepercaya, dan jangan transfer DP sebelum melihat unit langsung.']},
 {id:'a6',cat:'Berita',title:'5 SUV Listrik Terbaru yang Bisa Dipesan di Indonesia',date:'20 Nov 2024',read:5,seed:'art-suv',
  body:['Pasar SUV listrik nasional kian ramai. Beberapa model baru masuk daftar pendek keluarga Indonesia: mulai dari opsi premium dengan fast charging 800V hingga pilihan menengah dengan jangkauan 400+ km.','Yang menarik, tren harga mulai turun. Konkurensi antar pabrikan membuat fitur yang dulu eksklusif — heat pump, ADAS level 2, layar 12 inci — kini hadir di segmen Rp 300–400 juta.','Untuk memilih, fokus pada tiga hal: jangkauan riil (bukan klaim katalog), jaringan purna jual, dan garansi baterai. Ketiganya menentukan pengalaman kepemilikan lima tahun ke depan.']},
 {id:'a7',cat:'Jual',title:'Foto Iklan Kendaraan yang Membuat Pembeli Percaya',date:'14 Nov 2024',read:4,seed:'art-foto',
  body:['Iklan dengan 8 foto berkualitas mendapat kontak hampir dua kali lebih banyak dibanding iklan 3 foto gelap. Aturan dasarnya: potret di tempat terbuka antara pukul 07.00–09.00 pagi ketika cahaya lembut.','Urutan foto yang efektif: depan 45 derajat, samping kiri, samping kanan, belakang, dashboard & odometer, kursi, kap mesin, lalu bagian yang jujur menunjukkan cacat kecil. Justru foto kejujuran meningkatkan kepercayaan pembeli.','Hindari filter berlebihan, cahaya lampu kuning malam, dan latar rumit. Latar polos tembok putih sudah lebih dari cukup.']},
 {id:'a8',cat:'Tips',title:'Memahami Buku Servis dan Riwayat Unit',date:'9 Nov 2024',read:5,seed:'art-servis',
  body:['Buku servis adalah KTP kesehatan sebuah mobil. Yang perlu Anda cari: apakah interval servis rutin (5.000–10.000 km), apakah ada catatan penggantian komponen besar seperti timing belt atau transmisi, dan apakah odometer naik secara konsisten antar tanggal servis.','Red flag yang sering terlewat: kilometer yang malah turun antar entri (indikasi rollback), jeda servis sangat panjang, atau stiker servis bertulis di kaca tetapi tidak ada di buku.','Banyak dealer resmi kini punya database digital — minta penjual menunjukkan riwayatnya. Jika ragu, cek ke dealer ATPM dengan nomor rangka.']},

function applyFilter(f){
 let vs=allVehicles();
 if(f.type)vs=vs.filter(v=>v.type===f.type);
 if(f.cond)vs=vs.filter(v=>v.condition===f.cond);
 if(f.brand)vs=vs.filter(v=>v.brand===f.brand);
 if(f.model)vs=vs.filter(v=>v.model===f.model);
 if(f.body)vs=vs.filter(v=>v.bodyType===f.body);
 if(f.priceMin)vs=vs.filter(v=>v.price>=+f.priceMin);
 if(f.priceMax)vs=vs.filter(v=>v.price<=+f.priceMax);
 if(f.yearMin)vs=vs.filter(v=>v.year>=+f.yearMin);
 if(f.yearMax)vs=vs.filter(v=>v.year<=+f.yearMax);
 if(f.kmMax)vs=vs.filter(v=>v.km<=+f.kmMax);
 if(f.trans)vs=vs.filter(v=>v.trans.toLowerCase().startsWith(f.trans.toLowerCase()));
 if(f.fuel)vs=vs.filter(v=>v.fuel===f.fuel||v.ev);
 if(f.color)vs=vs.filter(v=>v.color===f.color);
 if(f.seats)vs=vs.filter(v=>v.type==='motor'||v.seats>=+f.seats);
 if(f.prov)vs=vs.filter(v=>v.prov===f.prov);
 if(f.city)vs=vs.filter(v=>v.city===f.city);
 if(f.seller)vs=vs.filter(v=>sellerOf(v)?.type===f.seller);
 if(f.q){const s=f.q.toLowerCase();vs=vs.filter(v=>(vTitle(v)+' '+v.city).toLowerCase().includes(s));}
 const S={new:(a,b)=>b.createdAt-a.createdAt,cheap:(a,b)=>a.price-b.price,exp:(a,b)=>b.price-a.price,year:(a,b)=>b.year-a.year,km:(a,b)=>a.km-b.km};
 vs.sort(S[f.sort]||S.new);
 return vs;
}

function chipLabel(k,v){
 const M={brand:['Merek',id=>(BRANDS.find(b=>b.id===id)||{n:id}).n],priceMin:['Harga ≥',x=>shortP(+x)],priceMax:['Harga ≤',x=>shortP(+x)],kmMax:['KM ≤',x=>kmf(+x)]};
 return M[k]?`${M[k][0]} ${M[k][1](v)}`:({type:['Jenis',x=>x==='motor'?'Motor':'Mobil'],cond:['Kondisi',x=>x[0].toUpperCase()+x.slice(1)],model:['Model',x=>x],body:['Bodi',x=>x],yearMin:['Tahun ≥',x=>x],yearMax:['Tahun ≤',x=>x],trans:['Transmisi',x=>x],fuel:['BBM',x=>x],color:['Warna',x=>x],seats:['Kursi ≥',x=>x],prov:['Provinsi',x=>x],city:['Kota',x=>x],seller:['Penjual',x=>x==='dealer'?'Showroom':'Perorangan'],q:['Kata kunci',x=>x]})[k]?.[1](v)||k;
}

const MG={
 go(h){location.hash=h},
 soon(){toast('Tautan sosial media: demo statis.')},

 setLang(l){store.set('mg_lang',l);chrome();router();toast('Bahasa diubah ke '+(l==='id'?'Indonesia':'English (nav saja — i18n siap dikembangkan)'))},
 closeDrawers(){$('#menuDrawer').classList.remove('on');$('#filterDrawer').classList.remove('on');$('#ovl').classList.remove('on')},
 fDrawerOpen(){$('#filterDrawer').innerHTML=`<div class="drawer-h"><b style="font-family:var(--fd)">Filter</b><button class="icbtn" onclick="MG.closeDrawers()" aria-label="Tutup">${icon('x')}</button></div><div class="drawer-b" id="fd-body">${filterForm(workF,'listing')}</div>`;
  $('#filterDrawer').classList.add('on');$('#ovl').classList.add('on');icons()},
 search(){const q={};if($('#hs-type').value)q.type=$('#hs-type').value;if($('#hs-brand').value)q.brand=$('#hs-brand').value;
  if($('#hs-price').value)q.priceMax=$('#hs-price').value;if($('#hs-loc').value)q.prov=$('#hs-loc').value;
  toast('Mencari kendaraan…');setTimeout(()=>MG.go('#/listing?'+new URLSearchParams(q).toString()),400)},
 // ----- listing
 fSet(k,v,base){
  if(!workF)workF={...FDEF};
  workF[k]=v;if(k==='prov'&&v)workF.city='';
  const p={...workF};delete p._l;
  const url='#/'+(base||'listing')+'?'+new URLSearchParams(p).toString();
  if((k==='view'||k==='sort')&&url!==location.hash)MG._restore=window.scrollY;
  MG.go(url)},
 fDel(k,base){MG.fSet(k,'',base)},
 fReset(base){MG.go('#/'+(base||'listing')+'?type='+(workF?.type||'')+'&cond='+(workF?.cond||''))},
 more(base,l){const y=window.scrollY;workF._l=l+12;const el=$('#lst-area');if(el){el.innerHTML=listRender(workF,base);icons();window.scrollTo({top:y})}},
 saveSearch(){if(!workF)return;
  const q=Object.entries(workF).filter(([k,v])=>v&&FDEF[k]!==undefined&&FDEF[k]!==v&&k!=='_l');
  state.saved.push({q:new URLSearchParams(q).toString(),title:routeTitle(workF)+' · '+(BRANDS.find(b=>b.id===workF.brand)?.n||'Semua merek')+' '+(workF.model||''),n:applyFilter(workF).length,t:Date.now()});
  store.set('mg_saved',state.saved);toast('Pencarian disimpan — pantau dari menu Akun.')},
 delSaved(i){state.saved.splice(i,1);store.set('mg_saved',state.saved);router();toast('Pencarian dihapus.')},
 // ----- kartu aksi
 fav(id){const i=state.favs.indexOf(id);
  if(i<0){state.favs.push(id);toast('Ditambahkan ke favorit.')}else{state.favs.splice(i,1);toast('Dihapus dari favorit.')}

 cmp(id,del){

 softKeep(){const y=window.scrollY;router();window.scrollTo({top:y})},

 // ----- detail

  if(n.length<3||p.length<9){toast('Lengkapi nama & nomor WhatsApp.','err');return}
  const v=vehById(vid);
  state.leads.push({id:'L'+Date.now(),name:n,phone:p,note:`Test drive: ${vTitle(v)} ${v.year} — tanggal ${$('#bk-date').value||'(fleksibel)'}`,dealer:v.sellerId&&v.sellerId.startsWith('d')?v.sellerId:'-',t:Date.now()});
  MG.mClose();toast('Permintaan test drive terkirim! Penjual akan mengonfirmasi via chat.')},
 report(vid){reportModal(vid)},
 reportSend(vid){state.reports.push({id:'r'+Date.now(),vid,reason:$('#rp-reason').value,note:$('#rp-note').value.trim(),t:Date.now()});
  MG.mClose();toast('Laporan terkirim. Tim moderasi akan menindaklanjuti maks. 1×24 jam. Terima kasih!')},
 // ----- kredit
 kUpd(k,v){K[k]=+v||0;if(k==='price'){const e=document.getElementById('k-price');if(e&&+e.value!==K.price)e.value=K.price}MG.kPaint()},
 kChip(k,v){K[k]=+v;kreditPage({})},
 kPaint(){const loan=K.price*(1-K.dp/100),inst=calcInstall(K.price,K.dp,K.tenor,K.rate),tot=inst*K.tenor+K.price*K.dp/100;
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  s('k-inst',rupiah(inst));s('k-r-loan',rupiah(loan));s('k-r-dp',rupiah(K.price*K.dp/100));
  s('k-r-tot',rupiah(tot));s('k-r-bunga',rupiah(tot-K.price));
  s('k-dp-l',K.dp+'%');s('k-dp-v',rupiah(K.price*K.dp/100));s('k-tn-l',K.tenor+' bulan');s('k-rt-l',K.rate+'%')},
 leadForm(){leadModal()},
 leadSend(){const n=$('#ld-name').value.trim(),p=$('#ld-phone').value.trim();
  if(n.length<3||p.length<9){toast('Lengkapi nama & nomor WhatsApp.','err');return}
  state.leads.push({id:'L'+Date.now(),name:n,phone:p,note:`Pengajuan leasing: ${shortP(K.price)} · DP ${K.dp}% · ${K.tenor} bln · ${K.rate}%`,dealer:'-',t:Date.now()});
  MG.mClose();toast('Pengajuan terkirim ke mitra leasing! Konsultan akan menghubungi Anda (simulasi).')},
 cmCalc(vid,dp){const v=vehById(vid);if(!v)return;dp=+dp;
  const tnIn=document.querySelector(`input[data-vid="${vid}"]`);const tn=tnIn?+tnIn.value:48;
  $('#cm-dp').textContent=dp+'%';$('#cm-dp-v').textContent='('+rupiah(v.price*dp/100)+')';
  $('#cm-out').textContent=rupiah(calcInstall(v.price,dp,tn,7.5))},
 cmTn(el){const v=vehById(el.dataset.vid);if(!v)return;const tn=+el.value;
  const dpR=el.closest('.calc-mini').querySelector('input[type=range]');
  const dp=dpR?+dpR.value:20;
  $('#cm-tn').textContent=tn+' bulan';$('#cm-out').textContent=rupiah(calcInstall(v.price,dp,tn,7.5))},
 // ----- wizard jual
 swSync(){const g=id=>{const e=document.getElementById(id);return e?e.value:null};
  let x;x=g('sw-model');if(x!==null)SW.model=x;
  x=g('sw-variant');if(x!==null)SW.variant=x;
  x=g('sw-year');if(x!==null)SW.year=x;
  x=g('sw-km');if(x!==null)SW.km=x;
  x=g('sw-cc');if(x!==null)SW.cc=x;
  x=g('sw-name');if(x!==null)SW.name=x;
  x=g('sw-phone');if(x!==null)SW.phone=x},
 swNext(){const s=SW,e=$('#sw-err');
  if(s.step===1){MG.swSync();
   if(!s.model||!s.year||!s.cc||s.km===''){e.textContent='Lengkapi model, tahun, cc'+(s.cond==='bekas'?' dan jarak tempuh':'')+'.';return}
   if(+s.year<1990||+s.year>2025){e.textContent='Tahun tidak valid.';return}}
  if(s.step===2&&s.photos.length<5){e.textContent='Minimal 5 foto. Gunakan tombol "Gunakan 5 foto contoh" untuk demo cepat.';return}
  if(s.step===3){s.price=$('#sw-price').value;s.desc=$('#sw-desc').value.trim();
   if(!s.price||+s.price<1e6){e.textContent='Masukkan harga yang valid (min. Rp 1.000.000).';return}
   if(s.desc.length<30){e.textContent='Deskripsi minimal 30 karakter — jujur & informatif.';return}}
  if(s.step===4){MG.swSync();
   if(!s.name||s.phone.length<9){e.textContent='Lengkapi nama & nomor WhatsApp.';return}}
  e.textContent='';s.step++;swRender()},
 swBack(){SW.step--;swRender()},
 swFiles(files){[...files].slice(0,15-SW.photos.length).forEach(f=>{const r=new FileReader();r.onload=ev=>{SW.photos.push(ev.target.result);swRender()};r.readAsDataURL(f)})},
 swDrop(e){e.preventDefault();const d=document.getElementById('drop');if(d)d.classList.remove('over');MG.swFiles(e.dataTransfer.files)},
 swDemoPhotos(){[("https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/2022_Toyota_Avanza_1.5_G_Toyota_Safety_Sense_W101RE_%2820220403%29.jpg/960px-2022_Toyota_Avanza_1.5_G_Toyota_Safety_Sense_W101RE_%2820220403%29.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/2018_Mitsubishi_Xpander_Ultimate_1.5_NC1W_%2820190623%29.jpg/960px-2018_Mitsubishi_Xpander_Ultimate_1.5_NC1W_%2820190623%29.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Honda_Brio_DD1_FL_1.2_V_Rallye_Red.jpg/960px-Honda_Brio_DD1_FL_1.2_V_Rallye_Red.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Yamaha_nmax_cpd150_YCP.JPG/960px-Yamaha_nmax_cpd150_YCP.JPG?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Honda_Jazz_Hybrid_Executive_%28IV%29_%E2%80%93_f_18102020.jpg/960px-Honda_Jazz_Hybrid_Executive_%28IV%29_%E2%80%93_f_18102020.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail")].flat().forEach(u=>SW.photos.push(u));swRender();toast('5 foto contoh ditambahkan (ganti dengan foto asli saat tayang).')},
 swDragStart(e,i){e.dataTransfer.setData('text/plain',String(i))},
 swDropReorder(e,j){e.preventDefault();const i=+e.dataTransfer.getData('text/plain');if(isNaN(i)||i===j)return;const p=SW.photos.splice(i,1)[0];SW.photos.splice(j,0,p);swRender()},
 swMove(i,d){const j=i+d;if(j<0||j>=SW.photos.length)return;const p=SW.photos.splice(i,1)[0];SW.photos.splice(j,0,p);swRender()},
 swDelPhoto(i){SW.photos.splice(i,1);swRender()},
 swPublish(){const s=SW;
  const v={id:'u'+Date.now(),owner:'me',status:'pending',type:s.type,condition:s.cond,brand:s.brand,model:s.model,variant:s.variant,
   year:+s.year,km:s.cond==='bekas'?+s.km:0,price:+s.price,trans:s.trans,fuel:s.fuel,cc:+s.cc,seats:+s.seats||7,bodyType:s.body,color:s.color,
   plate:s.plate,taxUntil:2026,owners:1,docs:'Menunggu kelengkapan dokumen dari penjual',city:s.city,prov:s.prov,images:s.photos.slice(0,15),
   features:['Kondisi sesuai foto','Bisa survey langsung'],desc:s.desc,views:0,createdAt:Date.now(),ageD:0,promoted:s.pkg!=='free',pkg:s.pkg};
  state.myAds.unshift(v);VEHC.push(v);state.modq.push(v);
  store.set('mg_myAds',state.myAds);
  SW=null;toast('Iklan terkirim & menunggu moderasi. Demo: masuk sebagai Admin → Panel Admin → Moderasi untuk menyetujui.');
  MG.go('#/akun?tab=iklan&st=pending')},
 // ----- akun/iklan
 adSold(id){const a=state.myAds.find(x=>x.id===id);if(!a)return;a.status='terjual';store.set('mg_myAds',state.myAds);router();toast('Selamat! Unit ditandai terjual.')},
 adEdit(id){const a=state.myAds.find(x=>x.id===id);if(!a)return;
  modal(`<h3>${icon('pencil')} Edit Iklan</h3><label>Harga (Rp)</label><input id="ae-price" type="number" value="${a.price}">
   <div style="height:10px"></div><label>Deskripsi</label><textarea id="ae-desc" rows="5">${esc(a.desc)}</textarea>
   <div style="height:14px"></div><button class="btn btn-b" style="width:100%" onclick="MG.adEditSave('${id}')">${icon('save')} Simpan Perubahan</button>`)},
 adEditSave(id){const a=state.myAds.find(x=>x.id===id);if(!a)return;
  a.price=+$('#ae-price').value||a.price;a.desc=$('#ae-desc').value.trim();
  store.set('mg_myAds',state.myAds);MG.mClose();router();toast('Iklan diperbarui.')},
 adPromote(id){modal(`<h3>${icon('rocket')} Promosikan Iklan</h3>
  <div style="display:grid;gap:10px">${[['prem','Premium — Rp 49.000','Naik peringkat pencarian, badge Premium, 30 hari'],['spot','Sorotan — Rp 99.000','Tampil di beranda + thumbnail besar, 14 hari']]
   .map(p=>`<div class="pkg" onclick="MG.adPromoteApply('${id}','${p[0]}')" role="button" tabindex="0"><div class="pk-name">${p[1]}</div><div style="font-size:12.5px;color:var(--muted)">${p[2]}</div></div>`).join('')}</div>
  <p style="font-size:12px;color:var(--amber);margin-top:12px">${icon('circle-alert')} Pembayaran paket = simulasi demo, tidak ada transaksi nyata.</p>`)},
 adPromoteApply(id,pkg){const a=state.myAds.find(x=>x.id===id);if(!a)return;
  a.promoted=true;a.pkg=pkg;a.status='aktif';
  store.set('mg_myAds',state.myAds);MG.mClose();router();toast('Iklan dipromosikan! (pembayaran simulasi)')},
 // ----- dealer
 csvModal(){csvModal()},
 csvImport(){const lines=$('#csv-in').value.trim().split('\n').filter(Boolean);let n=0;
  lines.forEach(l=>{const c=l.split(',').map(x=>x.trim());if(c.length<9)return;
   const b=BRANDS.find(x=>x.n.toLowerCase()===c[0].toLowerCase());
   const v={id:'u'+Date.now()+(n++),owner:'me',sellerId:'d1',status:'pending',type:'mobil',condition:'bekas',brand:b?b.id:c[0].toLowerCase(),
    model:c[1],variant:c[2],year:+c[3],km:+c[4],price:+c[5],trans:c[6],fuel:c[7],city:c[8],prov:(LOC.find(x=>x.c.includes(c[8]))||{p:'DKI Jakarta'}).p,
    cc:1498,seats:7,color:'Putih',plate:'B',taxUntil:2026,owners:1,docs:'Menunggu kelengkapan dokumen',images:imgs('csv'+Date.now()+n),
    features:['Hasil impor CSV'],desc:'Unit hasil impor stok showroom.',views:0,createdAt:Date.now(),ageD:0,pkg:'free'};
   state.myAds.unshift(v);VEHC.push(v);state.modq.push(v)});
  store.set('mg_myAds',state.myAds);
  MG.mClose();toast(n+' unit diimpor dengan status Pending (setujui via Panel Admin → Moderasi).');MG.go('#/dealerdash')},
 // ----- admin
 modOk(id){const i=state.modq.findIndex(v=>v.id===id);if(i<0)return;
  const v=state.modq.splice(i,1)[0];v.status='aktif';
  if(!VEHC.find(x=>x.id===v.id))VEHC.push(v);
  if(v.owner==='me')store.set('mg_myAds',state.myAds);
  router();toast(`Iklan "${vTitle(v)}" disetujui & tayang.`)},
 modNo(id){const i=state.modq.findIndex(v=>v.id===id);if(i<0)return;
  const v=state.modq.splice(i,1)[0];
  if(v.owner==='me'){state.myAds=state.myAds.filter(x=>x.id!==v.id);store.set('mg_myAds',state.myAds)}
  const ix=VEHC.findIndex(x=>x.id===v.id);if(ix>=0)VEHC.splice(ix,1);
  router();toast(`Iklan "${vTitle(v)}" ditolak. Notifikasi dikirim ke penjual.`)},
 verifyDealer(id){const d=DEALERS.find(x=>x.id===id);if(!d)return;d.verified=true;router();toast(`Showroom "${d.name}" berhasil diverifikasi.`)},
 takeDown(rid,vid){state.reports=state.reports.filter(r=>r.id!==rid);
  const ix=VEHC.findIndex(v=>v.id===vid);if(ix>=0)VEHC.splice(ix,1);
  state.myAds=state.myAds.filter(v=>v.id!==vid);store.set('mg_myAds',state.myAds);
  router();toast('Iklan diturunkan dari platform.')},
 dismissReport(rid){state.reports=state.reports.filter(r=>r.id!==rid);router();toast('Laporan diabaikan.')},
 addBrand(){const n=$('#ad-brand').value.trim();if(!n)return;BRANDS.push({id:n.toLowerCase(),n});router();toast(`Merek "${n}" ditambahkan ke master data.`)},
 addCity(){const n=$('#ad-city').value.trim();if(!n)return;LOC[0].c.push(n);router();toast(`Kota "${n}" ditambahkan ke master data.`)},
 saveBanner(){state.bannerTxt=$('#bn-txt').value.trim()||state.bannerTxt;toast('Banner beranda diperbarui — buka Beranda untuk melihat.')},
 togglePromo(){state.promoOn=!state.promoOn;router();toast('Banner '+(state.promoOn?'ditampilkan':'disembunyikan')+'.')},
 // ----- auth
 otpFlow(){const id=$('#lg-id').value.trim();
  if(!otpSent){if(id.length<5){toast('Masukkan email atau nomor WhatsApp yang valid.','err');return}
   otpSent=true;$('#lg-otp').classList.remove('hide');$('#lg-otp-btn').textContent='Verifikasi & Masuk';toast('Kode OTP terkirim (demo: 123456).');return}
  if($('#lg-otp-in').value.trim()!=='123456'){toast('OTP salah. Untuk demo gunakan 123456.','err');return}
  MG.doLogin({name:id.split('@')[0].replace(/[^a-zA-Z]/g,' ').trim()||'Pengguna',email:id,role:'pembeli'})},
 googleLogin(){MG.doLogin({name:'Alex Pratama',email:'alex.pratama@gmail.com',role:'pembeli'})},
 quickLogin(r){MG.doLogin(r==='dealer'?{name:'Pak Hendra',email:'hendra@autoprima.id',role:'dealer'}:r==='admin'?{name:'Admin MG',email:'admin@multinetgarage.id',role:'admin'}:{name:'Dina Maharani',email:'dina.m@gmail.com',role:'pembeli'})},
 doLogin(u){state.user=u;store.set('mg_user',u);otpSent=false;chrome();
  toast(`Selamat datang, ${u.name}! (${u.role==='admin'?'Panel Admin terbuka':u.role==='dealer'?'Dashboard Dealer terbuka':'akun pembeli'})`);
  MG.go(u.role==='admin'?'#/admin':u.role==='dealer'?'#/dealerdash':'#/akun')},
 logout(){state.user=null;store.set('mg_user',null);chrome();MG.go('#/');toast('Anda telah keluar.')},
 accMenu(e){e.stopPropagation();if(document.getElementById('acc-drop')){MG.dropClose();return}
  const u=state.user,r=e.currentTarget.getBoundingClientRect(),d=document.createElement('div');
  d.className='drop';d.id='acc-drop';d.style.position='fixed';d.style.top=(r.bottom+8)+'px';d.style.right=(innerWidth-r.right)+'px';
  d.innerHTML=`<a onclick="MG.go('#/akun');MG.dropClose()">${icon('user')}Profil</a>
   <a onclick="MG.go('#/akun?tab=iklan');MG.dropClose()">${icon('megaphone')}Iklan Saya</a>
   <a onclick="MG.go('#/akun?tab=favorit');MG.dropClose()">${icon('heart')}Favorit</a>
   <a onclick="MG.go('#/akun?tab=pesan');MG.dropClose()">${icon('message-circle')}Pesan</a>
   ${u.role==='dealer'?`<a onclick="MG.go('#/dealerdash');MG.dropClose()">${icon('layout-dashboard')}Dashboard Dealer</a>`:''}
   ${u.role==='admin'?`<a onclick="MG.go('#/admin');MG.dropClose()">${icon('shield')}Panel Admin</a>`:''}
   <div class="sep"></div><a onclick="MG.logout()">${icon('log-out')}Keluar</a>`;
  document.body.appendChild(d);icons();document.addEventListener('click',()=>MG.dropClose(),{once:true})},
 dropClose(){const e=document.getElementById('acc-drop');if(e)e.remove()},
 notifOpen(e){e.stopPropagation();if(document.getElementById('notif-drop')){MG.notifDropClose();return}
  const r=e.currentTarget.getBoundingClientRect(),d=document.createElement('div');
  d.className='drop';d.id='notif-drop';d.style.position='fixed';d.style.top=(r.bottom+8)+'px';d.style.right=(innerWidth-r.right)+'px';d.style.minWidth='300px';
  d.innerHTML=`<b style="padding:6px 12px;display:block;font-family:var(--fd)">Notifikasi</b>`+
   state.notifs.map(n=>`<a style="align-items:flex-start"><span style="color:var(--orange);margin-top:2px">${icon(n.ic)}</span><span style="white-space:normal"><b style="display:block;font-weight:600;font-size:13px">${esc(n.x)}</b><small style="color:var(--muted)">${n.t}</small></span></a>`).join('');
  document.body.appendChild(d);icons();document.addEventListener('click',()=>MG.notifDropClose(),{once:true})},
 notifDropClose(){const e=document.getElementById('notif-drop');if(e)e.remove()},
 mClose(){$('#modal-root').innerHTML=''},
 scrollBrow(d){const b=document.getElementById('brow');if(b)b.scrollBy({left:d*300,behavior:'smooth'})},
 resetAll(){['mg_user','mg_favs','mg_saved','mg_chats','mg_myAds','mg_theme','mg_lang'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}
};
router.softKeep=MG.softKeep;
router.refreshLight=MG.refreshLight;

/* ---------- Routing & keyboard ---------- */
window.addEventListener('hashchange',router);
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape')return;
 MG.closeDrawers();MG.mClose();
 if($('#lightbox-root').innerHTML)MG.lbClose();
 MG.dropClose();MG.notifDropClose();
});
router();
</script>
